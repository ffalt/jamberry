name: test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - '!**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run test
