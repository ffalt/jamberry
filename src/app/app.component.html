@if (auth.user) {
	<app-header class="header" />
}
<div #tabContentOutlet [class.player-active]="!!this.player.currentMedia && !nowPlayingActive()" class="app-content"></div>
@if (auth.user && !nowPlayingActive()) {
	<app-player class="footer" />
}
@if (!nowPlayingActive() && (this.player.currentMedia || !this.queue.isEmpty)) {
	<app-mini-player class="mini-player" />
}
