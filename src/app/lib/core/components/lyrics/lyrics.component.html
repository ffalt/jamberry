@if (syncedLyrics(); as synced) {
	<div class="info">
		<div class="description">
			<div class="note">
				<div class="synced-lyrics" [class.is-playing]="isCurrentlyPlaying()">
					@for (line of synced; track $index) {
						<div
							class="synced-line"
							[class.active]="currentLineIndex() === $index"
						>
							<span class="synced-time" (click)="seek(line.timestamp)">{{ line.timestamp | mediaduration }}</span>
							<span class="synced-text" [innerHTML]="line.text.trim() === '' ? '&nbsp;' : line.text"></span>
						</div>
					}
				</div>
				@if (lyricsSource(); as lyricsSource) {
					<div class="info-footnote">
						<a i18n [href]="lyricsSource">Source</a>
					</div>
				}
			</div>
		</div>
	</div>
} @else if (lyrics(); as unsynced) {
	<div class="info">
		<div class="description">
			<div class="note">
				@for (note of unsynced; track $index) {
					<div class="lyrics-line">
						<div [innerHTML]="note.trim() === '' ? '&nbsp;' : note"></div>
					</div>
				}
				@if (lyricsSource(); as lyricsSource) {
					<div class="info-footnote">
						<a i18n [href]="lyricsSource">Source</a>
					</div>
				}
			</div>
		</div>
	</div>
} @else {
	<app-loading />
}
